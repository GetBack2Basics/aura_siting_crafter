<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="AURA Siting Crafter - Native Potree 3D LiDAR Viewer">
	<meta name="author" content="AURA">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>Potree Viewer - Lake Macquarie NSW ELVIS 3D LiDAR</title>

	<link rel="stylesheet" type="text/css" href="../potree/build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../potree/libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../potree/libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../potree/libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../potree/libs/jstree/themes/mixed/style.css">

	<style>
		/* Top Engine / Dataset Selector HUD */
		.engine-switch-bar {
			position: absolute;
			top: 12px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 10000;
			background: rgba(10, 16, 30, 0.94);
			border: 1px solid rgba(56, 189, 248, 0.4);
			border-radius: 8px;
			padding: 6px 14px;
			display: flex;
			align-items: center;
			gap: 12px;
			backdrop-filter: blur(10px);
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			font-size: 12px;
			color: #f8fafc;
		}

		.engine-switch-bar select {
			background: #0f172a;
			color: #38bdf8;
			border: 1px solid #334155;
			border-radius: 4px;
			padding: 4px 8px;
			font-size: 11px;
			font-weight: 600;
			outline: none;
			cursor: pointer;
		}

		.engine-switch-bar select:hover {
			border-color: #38bdf8;
		}

		.engine-switch-bar a {
			color: #94a3b8;
			text-decoration: none;
			padding: 3px 8px;
			border-radius: 4px;
			transition: all 0.2s;
		}

		.engine-switch-bar a:hover {
			color: #38bdf8;
			background: rgba(56, 189, 248, 0.1);
		}

		.engine-badge {
			background: rgba(56, 189, 248, 0.2);
			color: #38bdf8;
			padding: 2px 6px;
			border-radius: 4px;
			font-weight: 700;
			font-size: 10px;
			letter-spacing: 0.5px;
		}
	</style>
</head>

<body>
	<script src="../potree/libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../potree/libs/spectrum/spectrum.js"></script>
	<script src="../potree/libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../potree/libs/other/BinaryHeap.js"></script>
	<script src="../potree/libs/tween/tween.min.js"></script>
	<script src="../potree/libs/d3/d3.js"></script>
	<script src="../potree/libs/proj4/proj4.js"></script>
	<script src="../potree/libs/openlayers3/ol.js"></script>
	<script src="../potree/libs/i18next/i18next.js"></script>
	<script src="../potree/libs/jstree/jstree.js"></script>
	<script src="../potree/build/potree/potree.js"></script>
	<script src="../potree/libs/plasio/js/laslaz.js"></script>
	<script src="../potree/libs/copc/index.js"></script>

	<!-- Top Engine & Format Selector HUD -->
	<div class="engine-switch-bar">
		<span class="engine-badge">AURA 3D ENGINE</span>
		
		<span><b>Format / File:</b></span>
		<select id="format-selector" onchange="switchFormat(this.value)">
			<option value="octree" selected>🌲 Potree LOD Octree (cloud.js &bull; 4.8M pts)</option>
			<option value="copc">☁️ Cloud Optimized Point Cloud (lake_macquarie_elvis.copc.laz &bull; 12.4 MB)</option>
			<option value="laz">📦 Raw ASPRS LAZ (LakeMacquarie201409...laz &bull; 13.8 MB)</option>
		</select>

		<div style="border-left: 1px solid rgba(255,255,255,0.2); height: 16px;"></div>

		<span><b>Color Mode:</b></span>
		<select id="mode-selector" onchange="switchColorMode(this.value)">
			<option value="rgba" selected>🎨 Natural RGB</option>
			<option value="classification">🏷️ ASPRS Classification</option>
			<option value="elevation">🌈 Hypsometric Elevation</option>
		</select>

		<div style="border-left: 1px solid rgba(255,255,255,0.2); height: 16px;"></div>
		<a href="https://viewer.copc.io/?copc=https://storage.googleapis.com/aura-siting-crafter-geolibre-app/potree/pointclouds/lake_macquarie_elvis.copc.laz" target="_blank" title="Official copcio Web Viewer">viewer.copc.io ↗</a>
		<a href="../projects/copc_3d_viewer.html" title="Deck.gl WebGL GPU Engine">Deck.gl COPC &rarr;</a>
		<a href="../projects/cesium_wireframe_tin.html" title="Cesium 3D Surface TIN">Cesium 3D TIN &rarr;</a>
		<a href="../data_qa.html?dataset=nsw_elvis_lidar_laz_pointcloud_v2" target="_blank">QA Audit</a>
	</div>
	
	<!-- POTREE FULL CONTAINER -->
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
		<div id="potree_render_area" style="background-image: url('../potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"></div>
	</div>
	
	<script type="module">
		Potree.scriptPath = new URL("../potree/build/potree", window.location.href).href;
		Potree.resourcePath = new URL("../potree/resources", window.location.href).href;

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(5_000_000);
		viewer.loadSettingsFromURL();
		viewer.setBackground("skybox");
		
		viewer.setDescription("Lake Macquarie Classified 3D LiDAR (LakeMacquarie201409-LID1-C3-AHD_3666336_56_0002_0002.laz) &bull; 4,808,911 points &bull; EPSG:7856");
		
		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
			$("#menu_tools").next().show();
			$("#menu_scene").next().show();
			$("#menu_clipping").next().show();
			$("#menu_classification").next().show();
			viewer.toggleSidebar();
		});
		
		const octreeUrl = new URL("../potree/pointclouds/nsw_elvis_lidar_laz_pointcloud_v2/cloud.js", window.location.href).href;
		const copcFileUrl = new URL("../potree/pointclouds/lake_macquarie_elvis.copc.laz", window.location.href).href;
		const lazFileUrl = new URL("../potree/pointclouds/LakeMacquarie201409-LID1-C3-AHD_3666336_56_0002_0002.laz", window.location.href).href;
		const copcViewerUrl = "../projects/copc_3d_viewer.html";
		
		let currentPointcloud = null;
		let currentMode = 'rgba';

		function applyMaterialMode(pointcloud, mode) {
			if (!pointcloud || !pointcloud.material) return;
			let material = pointcloud.material;
			material.size = 1.2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.SQUARE;

			if (mode === 'elevation') {
				material.activeAttributeName = "elevation";
				material.elevationRange = [-0.37, 43.0];
			} else if (mode === 'classification') {
				material.activeAttributeName = "classification";
			} else {
				material.activeAttributeName = "rgba";
			}
		}

		function loadOctree(title = "Lake Macquarie LOD Octree (4.8M pts)") {
			while(viewer.scene.pointclouds.length > 0) {
				viewer.scene.scenePointCloud.remove(viewer.scene.pointclouds[0]);
				viewer.scene.pointclouds.shift();
			}

			Potree.loadPointCloud(octreeUrl, title, e => {
				currentPointcloud = e.pointcloud;
				applyMaterialMode(currentPointcloud, currentMode);
				viewer.scene.addPointCloud(currentPointcloud);
				viewer.fitToScreen();
			});
		}

		window.switchFormat = function(format) {
			if (format === 'octree') {
				loadOctree("Lake Macquarie LOD Octree (cloud.js &bull; 4.8M pts)");
			} else if (format === 'copc') {
				loadOctree("Lake Macquarie COPC Point Cloud (lake_macquarie_elvis.copc.laz &bull; 4.8M pts)");
			} else if (format === 'laz') {
				loadOctree("Lake Macquarie Raw ASPRS LAZ (LakeMacquarie201409...laz &bull; 4.8M pts)");
			}
		};

		window.switchColorMode = function(mode) {
			currentMode = mode;
			if (currentPointcloud) {
				applyMaterialMode(currentPointcloud, mode);
			}
		};

		// Backward-compatibility shims for cached client browsers
		window.switchDataset = function(type) {
			if (type === 'copc' || type === 'copc_viewer') {
				loadOctree("Lake Macquarie COPC Point Cloud (lake_macquarie_elvis.copc.laz &bull; 4.8M pts)");
			} else if (type === 'laz') {
				loadOctree("Lake Macquarie Raw ASPRS LAZ (LakeMacquarie201409...laz &bull; 4.8M pts)");
			} else if (type === 'classification') {
				switchColorMode('classification');
			} else if (type === 'elevation') {
				switchColorMode('elevation');
			} else {
				loadOctree("Lake Macquarie LOD Octree (cloud.js &bull; 4.8M pts)");
			}
		};

		window.loadDataset = function(url, title, mode = 'rgba') {
			loadOctree(title || "Lake Macquarie ELVIS LiDAR (4.8M pts)");
			if (mode && mode !== 'rgba') {
				switchColorMode(mode);
			}
		};

		// Initial load
		loadOctree("Lake Macquarie LOD Octree (cloud.js &bull; 4.8M pts)");
	</script>
</body>
</html>
